plugins { id 'com.android.application' }
android {
    namespace 'ru.sokol.cleantv'
    compileSdk 35
    testBuildType 'release'
    defaultConfig {
        applicationId 'ru.sokol.cleantv'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        phoneRelease {
            if (System.getenv('SOKOL_SIGNING_STORE')) {
                storeFile file(System.getenv('SOKOL_SIGNING_STORE'))
                storePassword System.getenv('SOKOL_SIGNING_PASSWORD')
                keyAlias 'sokol-cleantv'
                keyPassword System.getenv('SOKOL_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.phoneRelease
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES'] } }
    lint { abortOnError true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.8.0'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
